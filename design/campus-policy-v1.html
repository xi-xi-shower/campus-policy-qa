.app-window{display:flex;width:min(1180px,100%);height:min(820px,calc(100dvh - 64px));min-height:600px;background:var(--bg-primary);border-radius:10px;overflow:hidden;box-shadow:0 0 0 .5px var(--border-strong),0 2px 8px rgba(0,0,0,.16),0 8px 30px rgba(0,0,0,.28),0 24px 60px rgba(0,0,0,.16)}.sidebar{width:240px;flex-shrink:0;background:color-mix(in srgb,var(--bg-primary) 82%,transparent);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);box-shadow:.5px 0 0 var(--border);display:flex;flex-direction:column;padding:0 16px 16px}.window-controls{height:52px;display:flex;align-items:center;gap:8px}.window-controls span{width:12px;height:12px;border-radius:50%;background:#FF5F57}.window-controls span:nth-child(2){background:#FEBC2E}.window-controls span:nth-child(3){background:#28C840}.brand{display:flex;align-items:center;gap:12px;padding:16px 0 24px}.brand-icon,.assistant-icon{background:var(--bg-secondary);box-shadow:0 0 0 .5px var(--border-strong);border-radius:8px;display:grid;place-items:center;width:36px;height:36px;color:var(--text-primary)}.brand-icon svg{width:20px;height:20px}.brand strong{font-size:15px;font-weight:600}.brand small{display:block;color:var(--text-secondary);font-size:11px;margin-top:4px;letter-spacing:1px}.new-chat{display:flex;align-items:center;gap:8px;height:34px;width:100%;background:var(--bg-secondary);box-shadow:0 0 0 .5px var(--border-strong);padding:6px 12px}.new-chat:hover{background:var(--bg-tertiary)}kbd{font:11px "SF Mono",Menlo,monospace;color:var(--text-secondary)}.new-chat kbd{margin-left:auto}.sidebar-label{font-size:11px;color:var(--text-secondary);margin:24px 8px 8px}.history-button{display:flex;width:100%;align-items:center;gap:8px;text-align:left;height:32px;padding:6px 8px;color:var(--text-secondary);font-size:12px;white-space:nowrap}.history-button span{overflow:hidden;text-overflow:ellipsis}.history-button.selected{background:var(--surface-active);color:var(--text-primary)}.sidebar-footer{margin-top:auto;padding-top:24px}.local-status{display:flex;align-items:center;gap:8px;padding:12px 8px;font-size:12px;box-shadow:0 -.5px 0 var(--border);color:var(--text-secondary)}.status-dot{width:6px;height:6px;border-radius:50%;background:#30D158}.sidebar-note{font-size:11px;padding:0 8px;color:var(--text-tertiary)}
/* Main workspace */
.workspace{min-width:0;flex:1;display:flex;flex-direction:column;background:var(--bg-primary)}.toolbar{height:52px;flex-shrink:0;display:flex;align-items:center;padding:0 20px;gap:12px;box-shadow:0 .5px 0 var(--border)}.toolbar-title{font-size:12px;color:var(--text-secondary)}.toolbar-end{margin-left:auto;display:flex;gap:12px;align-items:center}.toolbar-end .tag{font-size:9px;letter-spacing:1px}.content-scroll{flex:1;overflow:auto;scrollbar-width:thin;scrollbar-color:var(--bg-tertiary) transparent;padding:32px 24px 24px}.welcome{width:min(640px,100%);margin:32px auto 0;animation:appear 400ms var(--ease-out)}.welcome-emblem{height:52px;width:52px;border-radius:12px;background:var(--bg-secondary);box-shadow:0 0 0 .5px var(--border-strong),0 4px 16px rgba(0,0,0,.2);display:grid;place-items:center;margin-bottom:24px}.welcome-emblem svg{height:28px;width:28px;color:var(--text-primary)}.eyebrow{font-size:11px;color:var(--text-secondary);letter-spacing:1px;margin-bottom:8px}.welcome h1{font-size:26px;line-height:32px;font-weight:700;letter-spacing:-.5px}.welcome-description{margin-top:12px;line-height:22px}.suggestion-heading{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text-secondary);margin:32px 0 12px}.suggestions{display:grid;grid-template-columns:1fr 1fr;gap:12px}.suggestion{padding:16px;text-align:left;box-shadow:0 0 0 .5px var(--border-strong);border-radius:8px;position:relative;min-height:112px}.suggestion:hover{background:var(--bg-secondary);box-shadow:0 0 0 .5px var(--text-tertiary)}.suggestion-top{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:11px;color:var(--text-secondary)}.suggestion-top svg{color:var(--accent)}.suggestion:nth-child(2) .suggestion-top svg{color:#BF5AF2}.suggestion:nth-child(3) .suggestion-top svg{color:#FF9F0A}.suggestion:nth-child(4) .suggestion-top svg{color:#30D158}.suggestion strong{font-size:13px;font-weight:400;display:block;padding-right:16px}.suggestion-arrow{position:absolute;right:12px;bottom:16px;color:var(--text-tertiary)}.welcome-footnote{display:flex;align-items:center;gap:8px;font-size:11px;margin-top:24px;color:var(--text-secondary)}.welcome-footnote svg{width:12px;height:12px}
/* Conversation and composer */
.messages{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:24px}.message{animation:appear 250ms var(--ease-out)}.user-message{align-self:flex-end;max-width:85%;padding:12px 16px;border-radius:12px 12px 4px 12px;background:var(--bg-secondary);white-space:pre-wrap;overflow-wrap:anywhere;user-select:text}.assistant-header{display:flex;align-items:center;gap:8px;margin-bottom:16px;font-size:12px}.assistant-icon{width:28px;height:28px;border-radius:6px}.assistant-message h2{font-size:17px;line-height:22px;font-weight:600;margin:12px 0}.answer-body{line-height:24px;color:var(--text-primary);user-select:text}.answer-body p,.answer-body li,.answer-body strong{user-select:text}.answer-body p{color:var(--text-primary)}.answer-body ol{padding-left:20px;margin:12px 0}.answer-body li{padding-left:4px;margin-bottom:8px;color:var(--text-secondary)}.answer-body li strong{color:var(--text-primary);font-weight:500}.answer-disclaimer{font-size:12px;color:var(--text-secondary);padding:12px;background:var(--bg-secondary);border-radius:8px;margin-top:16px}.source-label{font-size:11px;color:var(--text-secondary);margin:16px 0 8px}.source-button{width:100%;display:flex;align-items:center;gap:12px;padding:12px;text-align:left;box-shadow:0 0 0 .5px var(--border-strong);border-radius:8px}.source-button>svg:first-child{color:var(--accent)}.source-button>svg:last-child{margin-left:auto;color:var(--text-secondary)}.source-button strong{font-weight:500;font-size:12px;display:block}.source-button small{color:var(--text-secondary);font-size:11px;display:block;margin-top:4px}.composer-area{flex-shrink:0;width:min(688px,100%);align-self:center;padding:16px 24px 20px}.composer{background:var(--bg-secondary);border-radius:12px;padding:12px;box-shadow:0 0 0 .5px var(--border-strong),0 4px 16px rgba(0,0,0,.2)}.composer:focus-within{box-shadow:0 0 0 1px var(--accent),0 4px 16px rgba(0,0,0,.2)}textarea{display:block;resize:none;border:0;width:100%;min-height:52px;max-height:120px;padding:8px 0;background:transparent;line-height:20px;user-select:text;cursor:text}textarea:focus-visible{outline:none}textarea::placeholder{color:var(--text-secondary)}.composer-bottom{display:flex;align-items:center;gap:8px}.composer-context{font-size:11px;color:var(--text-secondary);display:flex;align-items:center;gap:6px}.composer-context svg{width:12px;height:12px}.send-button{margin-left:auto;display:grid;place-items:center;width:28px;height:28px;background:var(--accent);color:var(--text-primary)}.send-button:hover{background:var(--accent);box-shadow:0 0 0 2px var(--surface-active)}.composer-hint{display:flex;justify-content:space-between;gap:12px;margin-top:12px;color:var(--text-secondary);font-size:11px}.composer-hint span:last-child{white-space:nowrap}.mobile-new{display:none}
/* Source details sheet */
dialog{width:min(480px,calc(100% - 32px));background:var(--bg-secondary);color:var(--text-primary);border:0;padding:24px;border-radius:12px;box-shadow:0 0 0 .5px var(--border-strong),0 8px 30px rgba(0,0,0,.28),0 24px 60px rgba(0,0,0,.16)}dialog::backdrop{background:rgba(0,0,0,.5)}.dialog-heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:12px}.dialog-heading h2{font-size:17px;font-weight:600}.source-details{margin:16px 0;line-height:24px;user-select:text}.source-details p{margin-bottom:12px;user-select:text}.dialog-footer{display:flex;justify-content:flex-end}.primary-button{height:28px;padding:6px 12px;background:var(--accent);font-size:12px}.primary-button:hover{background:var(--accent);box-shadow:0 0 0 2px var(--surface-active)}@keyframes appear{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@media(min-height:900px){.welcome{margin-top:56px}}
@media(max-width:850px){body{padding:16px}.app-window{height:calc(100dvh - 32px);min-height:560px}.sidebar{width:210px}.welcome{margin-top:16px}.content-scroll{padding-top:24px}.suggestion{padding:12px}}
@media(max-width:640px){body{padding:0;display:block}.app-window{width:100%;height:100dvh;min-height:0;border-radius:0}.sidebar{display:none}.toolbar{padding:0 16px}.toolbar-title{font-size:13px}.mobile-new{display:grid}.content-scroll{padding:24px 20px}.welcome{margin-top:16px}.welcome h1{font-size:22px;line-height:28px}.welcome-description{font-size:12px}.suggestion-heading{margin-top:24px}.suggestion{min-height:112px}.suggestion strong{font-size:12px;line-height:20px}.composer-area{padding:12px 20px 16px}.composer-hint span:last-child{display:none}.toolbar-end .tag{display:none}.welcome-footnote{line-height:18px}.welcome-emblem{margin-bottom:24px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<div class="app-window">

<script>
// All answers are local demonstration content, with no network requests.
const input=document.getElementById('question-input');
const messages=document.getElementById('messages');
const welcome=document.getElementById('welcome');
const scrollArea=document.getElementById('content-scroll');
const sendButton=document.getElementById('send-button');
const dialog=document.getElementById('detail-dialog');
const examples={
 scholarship:{title:'奖学金申请，可以先整理这三类信息',source:'奖助学金申请指南 · 示例文档',items:[['申请类别','确认准备申请的奖学金名称、面向对象与所属学年。'],['评审条件','在正式通知中核对成绩、综合测评及其他要求；此演示不提供具体门槛。'],['材料与时间','查看实际通知中的材料清单、提交渠道及截止时间。']]},
 course:{title:'能否退课，需要先核对当前学期的安排',source:'选课与退课说明 · 示例文档',items:[['所处阶段','确认目前处于选课、补退选还是课程开始后的阶段。'],['课程类型','记录课程名称、课程性质及当前选课状态，方便向教务咨询。'],['办理依据','以本学期教务通知为依据确认是否可办理、如何审批及相关影响。']]},
 leave:{title:'请假前，可以先准备这些咨询信息',source:'学生请假流程 · 示例文档',items:[['时间与事由','整理请假起止时间和需要说明的事由。'],['课程安排','确认请假期间涉及哪些课程、考试或集体活动。'],['申请方式','向辅导员或相关负责老师核实正式流程、材料及返校后的要求。']]},
 dorm:{title:'宿舍报修，可以先把故障描述清楚',source:'校园生活服务指南 · 示例文档',items:[['故障位置','记录校区、楼栋、房间和具体设施位置。'],['问题描述','说明故障表现、发生时间，可准备清晰的现场照片。'],['报修渠道','向宿舍管理人员确认当前官方报修入口和处理方式，本演示不提供实际入口。']]},
 general:{title:'这个问题，可以从查找对应通知开始',source:'校园政策检索说明 · 示例文档',items:[['补充范围','说明你关注的事项、校区或学年，帮助缩小检索范围。'],['定位通知','查找相关学校部门发布的最新正式通知。'],['核对细节','重点确认适用对象、办理时间、材料要求和咨询方式。']]}
};
function getExample(question){if(/奖|助学/.test(question))return examples.scholarship;if(/选课|退课|课程|学分/.test(question))return examples.course;if(/请假|返校/.test(question))return examples.leave;if(/宿舍|报修|住宿/.test(question))return examples.dorm;return examples.general;}
function showDialog(title,paragraphs){document.getElementById('dialog-title').textContent=title;const body=document.getElementById('dialog-content');body.replaceChildren();paragraphs.forEach(text=>{const p=document.createElement('p');p.textContent=text;body.append(p);});dialog.showModal();}
function sourceDetails(example){showDialog(example.source,['这是一份为展示引用交互而创建的示例资料，不是真实学校文件，也不具有政策效力。','示例摘要：'+example.items.map(item=>item[0]+'：'+item[1]).join(' '),'正式接入知识库后，此处可展示文件原文、发布部门、发布日期及对应条款。']);}
function ask(question){question=question.trim();if(!question)return;const example=getExample(question);welcome.hidden=true;const user=document.createElement('div');user.className='message user-message';user.textContent=question;messages.append(user);const answer=document.createElement('article');answer.className='message assistant-message';answer.innerHTML='<div class="assistant-header"><span class="assistant-icon"><svg aria-hidden="true"><use href="#i-spark"/></svg></span><strong>校园助手</strong><span class="tag">示例回答</span></div><div class="answer-body"><h2></h2><p>以下展示如何整理问题与下一步，仅用于体验问答界面。</p><ol></ol></div><div class="answer-disclaimer">当前未检索学校真实政策，不能据此判断申请资格、办理时限或审批结果。</div><div class="source-label">参考资料 · 1 份示例</div><button class="source-button"><svg aria-hidden="true"><use href="#i-document"/></svg><span><strong></strong><small>演示资料 · 点击查看详情</small></span><svg aria-hidden="true"><use href="#i-arrow"/></svg></button>';answer.querySelector('h2').textContent=example.title;example.items.forEach(([title,text])=>{const li=document.createElement('li');const strong=document.createElement('strong');strong.textContent=title+'。';li.append(strong,document.createTextNode(text));answer.querySelector('ol').append(li);});answer.querySelector('.source-button strong').textContent=example.source;answer.querySelector('.source-button').addEventListener('click',()=>sourceDetails(example));messages.append(answer);document.querySelector('#current-chat span').textContent=question;input.value='';sendButton.disabled=true;document.getElementById('conversation-title').textContent='校园政策问答';user.scrollIntoView({block:'start',behavior:'auto'});}
function newChat(){messages.replaceChildren();welcome.hidden=false;document.querySelector('#current-chat span').textContent='开始一段新对话';input.value='';sendButton.disabled=true;scrollArea.scrollTop=0;input.focus();}
document.getElementById('question-form').addEventListener('submit',event=>{event.preventDefault();ask(input.value);});
input.addEventListener('input',()=>{sendButton.disabled=!input.value.trim();});
input.addEventListener('keydown',event=>{if(event.key==='Enter'&&!event.shiftKey&&!event.isComposing){event.preventDefault();ask(input.value);}});
document.querySelectorAll('[data-question]').forEach(button=>button.addEventListener('click',()=>ask(button.dataset.question)));
document.getElementById('new-chat').addEventListener('click',newChat);
document.getElementById('mobile-new').addEventListener('click',newChat);
document.getElementById('current-chat').addEventListener('click',()=>{scrollArea.scrollTop=scrollArea.scrollHeight;input.focus();});
document.getElementById('about').addEventListener('click',()=>showDialog('关于这个 Demo',['广工校园助手是一份校园政策问答界面原型，采用 macOS 暗色设计。','你可以点击示例问题、输入自己的问题、查看示例来源，或新建对话。当前回答由本地示例模板生成，未连接模型或政策知识库。','对话只保留在当前页面，刷新后清空。快捷键：⌘ / Ctrl + K 聚焦输入，⌘ / Ctrl + Shift + O 新建对话。']));
document.getElementById('close-dialog').addEventListener('click',()=>dialog.close());
document.getElementById('confirm-dialog').addEventListener('click',()=>dialog.close());
dialog.addEventListener('click',event=>{if(event.target===dialog){const rect=dialog.getBoundingClientRect();if(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom)dialog.close();}});
document.addEventListener('keydown',event=>{if(dialog.open)return;if((event.metaKey||event.ctrlKey)&&event.key.toLowerCase()==='k'){event.preventDefault();input.focus();}if((event.metaKey||event.ctrlKey)&&event.shiftKey&&event.key.toLowerCase()==='o'){event.preventDefault();newChat();}});
</script>
</body>
</html>
